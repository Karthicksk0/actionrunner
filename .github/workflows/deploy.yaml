name: CI/CD deploy to Minikube

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2️⃣ Install Docker
      - name: Install Docker
        run: |
          sudo apt-get update
          sudo apt-get install -y docker.io

      # 3️⃣ Install kubectl
      - name: Install kubectl
        run: |
          sudo apt-get update
          sudo apt-get install -y kubectl

      # 4️⃣ Create kubeconfig files from GitHub secrets
      - name: Create kubeconfig files
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

          mkdir -p ~/.minikube
          echo "${{ secrets.KUBE_CLIENT_KEY }}"  | base64 -d > ~/.minikube/client.key
          echo "${{ secrets.KUBE_CLIENT_CERT }}" | base64 -d > ~/.minikube/client.crt
          echo "${{ secrets.KUBE_CA_CERT }}"    | base64 -d > ~/.minikube/ca.crt

      # 5️⃣ Build Docker image locally
      - name: Build Docker image
        run: |
          docker build -t demo-app:latest .

      # 6️⃣ Point Docker to Minikube environment
      - name: Setup Minikube Docker environment
        run: |
          eval $(minikube -p minikube docker-env)

      # 7️⃣ Build image inside Minikube Docker
      - name: Build Docker image inside Minikube
        run: |
          docker build -t demo-app:latest .

      # 8️⃣ Deploy to Kubernetes
      - name: Deploy to Minikube
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      # 9️⃣ Show status
      - name: Show Deployment Status
        run: |
          kubectl get pods -o wide


name: CI/CD deploy to Minikube

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout repo
        uses: actions/checkout@v4

      # Login to Docker Hub (optional)
      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build Docker image
      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/demo-app:latest .

      # Push Docker Hub
      - name: Push Docker
        if: env.DOCKERHUB_USERNAME != ''
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/demo-app:latest

      # Setup kubectl
      - name: Install kubectl
        run: |
          sudo apt-get update -y
          sudo snap install kubectl --classic

      # Configure kubeconfig
      - name: Setup kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config

      # Deploy to Kubernetes — replaces image automatically
      - name: Deploy
        run: |
          sed -i "s|<IMAGE_PLACEHOLDER>|${{ secrets.DOCKERHUB_USERNAME }}/demo-app:latest|g" k8s/deployment.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml


name: CI/CD deploy to Minikube

on:
push:
branches: ["main"]

jobs:
build:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repo
    uses: actions/checkout@v3

  # Install kubectl
  - name: Install kubectl
    run: |
      sudo apt-get update
      sudo apt-get install -y kubectl

  # Install Minikube
  - name: Install Minikube
    run: |
      curl -LO https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
      sudo install minikube-linux-amd64 /usr/local/bin/minikube

  # Start Minikube
  - name: Start Minikube
    run: |
      sudo minikube start --driver=docker

  # Create kubeconfig files from secrets
  - name: Create kubeconfig files
    run: |
      mkdir -p ~/.kube
      echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
      mkdir -p ~/.minikube
      echo "${{ secrets.KUBE_CLIENT_KEY }}"  | base64 -d > ~/.minikube/client.key
      echo "${{ secrets.KUBE_CLIENT_CERT }}" | base64 -d > ~/.minikube/client.crt
      echo "${{ secrets.KUBE_CA_CERT }}"    | base64 -d > ~/.minikube/ca.crt

  # Use Docker inside Minikube
  - name: Setup Minikube Docker environment
    run: |
      eval $(minikube -p minikube docker-env)

  # Build Docker image inside Minikube
  - name: Build Docker image
    run: |
      docker build -t demo-app:latest .

  # Deploy to Kubernetes
  - name: Deploy to Minikube
    run: |
      kubectl apply -f k8s/deployment.yaml
      kubectl apply -f k8s/service.yaml

  # Show status
  - name: Show Deployment Status
    run: |
      kubectl get pods -o wide
```


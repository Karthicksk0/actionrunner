name: CI/CD deploy to Minikube

on:
push:
branches:
- main

env:
PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout code
    uses: actions/checkout@v3

  - name: Set up Node.js
    uses: actions/setup-node@v3
    with:
      node-version: '14'

  - name: Install Node.js dependencies
    run: npm install

  - name: Build Docker image
    run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/my-app:${{ github.sha }} .

  - name: Log in to DockerHub
    run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

  - name: Push Docker image
    run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/my-app:${{ github.sha }}

deploy:
needs: build
runs-on: ubuntu-latest

steps:
  - name: Checkout code
    uses: actions/checkout@v3

  - name: Install kubectl
    run: |
      sudo apt-get update
      sudo apt-get install -y kubectl

  - name: Install Minikube
    run: |
      curl -LO https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
      sudo install minikube-linux-amd64 /usr/local/bin/minikube

  - name: Start Minikube
    run: |
      sudo minikube start --driver=docker

  - name: Use Minikube Docker ENV
    run: |
      eval $(minikube -p minikube docker-env)

  - name: Build Docker image inside Minikube
    run: |
      docker build -t demo-app:latest .

  - name: Deploy to Minikube
    run: |
      kubectl apply -f k8s/deployment.yaml
      kubectl apply -f k8s/service.yaml

  - name: Show deployment status
    run: kubectl get pods -o wide

